# CI for My-ERP.
# - governance-lint / api-context: offline contract + docs governance checks.
# - build: real monorepo gate (install → prisma validate → lint → typecheck → test → build).
#
# The deploy-dependent suites (api-newman, web-playwright, perf-k6) are reintroduced
# in later milestones once a running deployment + secrets exist; their templates are
# kept under .ai/skills/features/ci for reference.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  governance-lint:
    name: Governance Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run governance lint
        run: node .ai/skills/features/ci/scripts/ci-verify.mjs --suite governance

  api-context:
    name: API Context Verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run API context verification
        run: node .ai/skills/features/ci/scripts/ci-verify.mjs --suite api-context

  build:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enable corepack (pnpm)
        run: corepack enable
      - name: Authenticate to GitHub Packages (@willyu1007/web-workbench)
        # The repo .npmrc already scopes @willyu1007 → npm.pkg.github.com; this appends
        # the auth token at runtime (never committed). GITHUB_TOKEN suffices for same-owner
        # packages with packages:read; if cross-repo read is denied, set a PACKAGES_TOKEN
        # secret (a PAT with read:packages).
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}" >> .npmrc
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Prisma schema
        run: pnpm exec prisma validate --schema prisma/schema.prisma
      - name: Lint
        run: pnpm lint
      - name: UI governance (tokens/contract + token-only feature code)
        run: pnpm ui:governance
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
