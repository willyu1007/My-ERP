openapi: 3.1.0
info:
  title: My-ERP API
  version: 0.1.0
  description: |
    Canonical API contract for My-ERP (finance v1).
    After edits run:
      node .ai/skills/features/context-awareness/scripts/ctl-context.mjs touch
      node .ai/scripts/ctl-api-index.mjs generate --touch
servers:
  - url: http://localhost:8000
    description: Local development
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe (includes a DB ping)
      tags: [system]
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /v1/organization:
    get:
      operationId: getCurrentOrganization
      summary: The caller's current organization (org-scoped)
      tags: [organization]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller has no membership in the organization
  /v1/ledger-books:
    get:
      operationId: listLedgerBooks
      summary: List ledger books in the caller's organization
      tags: [ledger-books]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ledger books (org-scoped)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LedgerBook'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller lacks read permission / no membership
    post:
      operationId: createLedgerBook
      summary: Create a ledger book (账套) — admin/supervisor only
      tags: [ledger-books]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLedgerBook'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerBook'
        '400':
          description: Invalid body
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller lacks create permission
  /v1/invitations:
    get:
      operationId: listInvitations
      summary: List invitations (admin/supervisor)
      tags: [invitations]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Invitations (org-scoped)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Invitation' }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Caller lacks invite permission }
    post:
      operationId: createInvitation
      summary: Invite a user by email with a role (admin/supervisor)
      tags: [invitations]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvitation' }
      responses:
        '201':
          description: Created (carries the secret token)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '400': { description: Invalid body }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Caller lacks invite permission }
  /v1/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation (authenticated invitee — not yet a member)
      description: |
        Authn-only (PrincipalGuard); the caller is not yet a member. Validates the
        secret token + invited email + state machine, then creates the Membership.
      tags: [invitations]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInvitation' }
      responses:
        '200':
          description: Membership created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '400': { description: Invalid/expired/mismatched invitation }
        '401': { description: Missing or invalid bearer token }
        '404': { description: Invitation not found }
        '409': { description: Already a member }
  /v1/invitations/{id}/revoke:
    post:
      operationId: revokeInvitation
      summary: Revoke a pending invitation (admin/supervisor)
      tags: [invitations]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Revoked }
        '400': { description: Not a pending invitation }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Caller lacks invite permission }
        '404': { description: Invitation not found }
  /v1/members:
    get:
      operationId: listMembers
      summary: List organization members (admin/supervisor)
      tags: [members]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Members (org-scoped)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Membership' }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Caller lacks read permission }
  /v1/work-items:
    get:
      operationId: listWorkItems
      summary: List task-kernel work items (org-scoped; ledger scope applies when present)
      description: |
        Visibility and actionability are separate. The response includes
        backend-computed `availableActions`; frontends must not infer task
        permissions from local role names.
      tags: [work-items]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: view
          in: query
          required: false
          schema:
            type: string
            enum: [my_tasks, role_queue, created_by_me, handled_by_me, supervision, audit_readonly]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, claimed, waiting, returned, completed, canceled]
        - { name: sourceType, in: query, required: false, schema: { type: string } }
        - { name: sourceId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Work items visible to the caller
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkItem' }
        '400': { description: Invalid view/status/sourceId/limit/cursor filter }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Caller lacks read permission or supervision view access }
  /v1/work-items/{id}:
    get:
      operationId: getWorkItem
      summary: Work item detail with backend-computed actions
      tags: [work-items]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Work item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkItem' }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Caller lacks read permission }
        '404': { description: Work item not found in caller scope }
  /v1/work-items/{id}/actions/{actionKey}:
    post:
      operationId: actOnWorkItem
      summary: Execute a backend-authorized work item action
      description: |
        `complete` for finance voucher-review tasks posts the source voucher and
        completes the work item in one transaction. Stale `expectedVersion`
        values are rejected.
      tags: [work-items]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: actionKey, in: path, required: true, schema: { $ref: '#/components/schemas/WorkItemAction' } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkItemActionRequest' }
      responses:
        '200':
          description: Action executed
          content:
            application/json:
              schema:
                type: object
                required: [workItem]
                properties:
                  workItem: { $ref: '#/components/schemas/WorkItem' }
                  source:
                    oneOf:
                      - { $ref: '#/components/schemas/Voucher' }
                      - { type: 'null' }
        '400': { description: Invalid action or source state }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Action not available to caller }
        '404': { description: Work item or source not found }
        '409': { description: Stale version or no longer actionable }
  /v1/accounts:
    get:
      operationId: listAccounts
      summary: List chart of accounts (ledger-scoped, code order = tree pre-order)
      tags: [accounts]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Account' }
        '400': { description: No active ledger book on the token }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Ledger book not in caller's org / lacks read permission }
    post:
      operationId: createAccount
      summary: Create an account (accountant/admin)
      tags: [accounts]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccount' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { description: Invalid body / duplicate code / parent not found }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Lacks create permission }
  /v1/accounts/seed-standard:
    post:
      operationId: seedStandardChart
      summary: Seed the 《小企业准则》 standard chart (idempotent)
      tags: [accounts]
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Number of accounts newly seeded
          content:
            application/json:
              schema:
                type: object
                required: [seeded]
                properties: { seeded: { type: integer } }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Lacks create permission }
  /v1/accounts/{code}:
    patch:
      operationId: updateAccount
      summary: Update an account's name / aux types (accountant/admin)
      tags: [accounts]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                auxTypes: { type: array, items: { type: string } }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { description: Invalid body }
        '404': { description: Account not found }
  /v1/accounts/{code}/deactivate:
    post:
      operationId: deactivateAccount
      summary: Deactivate an account (blocked if it has active children)
      tags: [accounts]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Deactivated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { description: Account has active children }
        '404': { description: Account not found }
  /v1/vouchers:
    get:
      operationId: listVouchers
      summary: List journal vouchers (ledger-scoped; optional status filter)
      tags: [vouchers]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [draft, pending, posted, reversed] } }
      responses:
        '200':
          description: Vouchers
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Voucher' } }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Ledger not in org / lacks read }
    post:
      operationId: createVoucher
      summary: Create a draft voucher (accountant/cashier)
      tags: [vouchers]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateVoucher' } } }
      responses:
        '201':
          description: Created (draft; may be unbalanced)
          content: { application/json: { schema: { $ref: '#/components/schemas/Voucher' } } }
        '400': { description: Invalid body / non-leaf or inactive account / malformed line }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Lacks create permission }
  /v1/vouchers/{id}:
    get:
      operationId: getVoucher
      summary: Voucher detail (with lines)
      tags: [vouchers]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Voucher, content: { application/json: { schema: { $ref: '#/components/schemas/Voucher' } } } }
        '404': { description: Not found }
    patch:
      operationId: updateVoucher
      summary: Replace a draft voucher's header + lines (only while draft)
      tags: [vouchers]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateVoucher' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Voucher' } } } }
        '400': { description: Not a draft / invalid }
        '404': { description: Not found }
  /v1/vouchers/{id}/submit:
    post:
      operationId: submitVoucher
      summary: Submit a draft for review (draft → pending); enforces 借贷必平
      tags: [vouchers]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Submitted, content: { application/json: { schema: { $ref: '#/components/schemas/Voucher' } } } }
        '400': { description: Not a draft / unbalanced }
        '404': { description: Not found }
  /v1/vouchers/{id}/post:
    post:
      operationId: postVoucher
      summary: Post a pending voucher (pending → posted; SoD — maker ≠ poster)
      description: |
        职责分离: the maker cannot post their own voucher unless single-person mode
        is enabled on the ledger AND the caller confirms (body confirmSinglePerson).
      tags: [vouchers]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: { confirmSinglePerson: { type: boolean } }
      responses:
        '200': { description: Posted, content: { application/json: { schema: { $ref: '#/components/schemas/Voucher' } } } }
        '400': { description: Not pending / unbalanced }
        '403': { description: SoD — maker cannot post own (without single-person override) / lacks post }
        '404': { description: Not found }
  /v1/vouchers/{id}/reverse:
    post:
      operationId: reverseVoucher
      summary: Reverse a posted voucher (红冲) — creates a posted reversal voucher
      tags: [vouchers]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Original (now reversed) + the generated reversal voucher
          content:
            application/json:
              schema:
                type: object
                required: [original, reversal]
                properties:
                  original: { $ref: '#/components/schemas/Voucher' }
                  reversal: { $ref: '#/components/schemas/Voucher' }
        '400': { description: Not posted / already reversed }
        '403': { description: Lacks reverse permission }
        '404': { description: Not found }
  /v1/intakes:
    get:
      operationId: listIntakes
      summary: List capture intakes (ledger-scoped; optional status filter)
      tags: [intakes]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [received, extracting, extracted, drafted, confirmed, discarded, failed] } }
      responses:
        '200':
          description: Intakes
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Intake' } } } }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Ledger not in org / lacks read }
    post:
      operationId: captureIntake
      summary: Capture an economic event (photo/pdf/text) for extraction → voucher draft
      tags: [intakes]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CaptureIntake' } } }
      responses:
        '201':
          description: Created (status=received); extraction runs next
          content: { application/json: { schema: { $ref: '#/components/schemas/Intake' } } }
        '400': { description: Invalid body / unsupported kind / attachment too large }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Lacks create permission }
  /v1/intakes/{id}:
    get:
      operationId: getIntake
      summary: Intake detail (includes extraction; ERP-only, never sent to My-Chat)
      tags: [intakes]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Intake, content: { application/json: { schema: { $ref: '#/components/schemas/Intake' } } } }
        '404': { description: Not found }
  /v1/intakes/{id}/extract:
    post:
      operationId: extractIntake
      summary: Run extraction on a received intake (received → extracted)
      tags: [intakes]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Extracted, content: { application/json: { schema: { $ref: '#/components/schemas/Intake' } } } }
        '400': { description: No attachment / not extractable / invalid extraction }
        '404': { description: Not found }
  /v1/intakes/{id}/draft:
    post:
      operationId: draftIntake
      summary: Build a voucher draft from an extracted intake (extracted → drafted)
      tags: [intakes]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Drafted, content: { application/json: { schema: { $ref: '#/components/schemas/Intake' } } } }
        '400': { description: Not extracted / no valid extraction }
        '404': { description: Not found }
  /v1/intakes/{id}/discard:
    post:
      operationId: discardIntake
      summary: Discard an intake (→ discarded); any draft voucher remains a draft
      tags: [intakes]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Discarded, content: { application/json: { schema: { $ref: '#/components/schemas/Intake' } } } }
        '400': { description: Cannot discard a confirmed intake }
        '404': { description: Not found }
  /v1/ledger/trial-balance:
    get:
      operationId: getTrialBalance
      summary: Trial balance (试算平衡表) — derived from posted vouchers
      tags: [ledger]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Trial balance
          content: { application/json: { schema: { $ref: '#/components/schemas/TrialBalance' } } }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Ledger not in org / lacks read }
  /v1/ledger/accounts/{code}:
    get:
      operationId: getAccountLedger
      summary: Subsidiary ledger (明细分类账) for one account — derived, running balance
      tags: [ledger]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: Account ledger
          content: { application/json: { schema: { $ref: '#/components/schemas/AccountLedger' } } }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Ledger not in org / lacks read }
  /v1/periods:
    get:
      operationId: listPeriodCloses
      summary: List period-close records (会计期间结账状态)
      tags: [periods]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Periods
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PeriodClose' } } } }
  /v1/periods/{period}/readiness:
    get:
      operationId: getPeriodCloseReadiness
      summary: Close-readiness for a period (未过账 / 前期未结账)
      tags: [periods]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: period, in: path, required: true, schema: { type: string, example: '2026-06' } }]
      responses:
        '200': { description: Readiness, content: { application/json: { schema: { $ref: '#/components/schemas/PeriodCloseReadiness' } } } }
        '400': { description: Invalid period }
  /v1/periods/{period}/close:
    post:
      operationId: closePeriod
      summary: 期末结账 — 结转损益 + lock the period
      tags: [periods]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: period, in: path, required: true, schema: { type: string, example: '2026-06' } }]
      responses:
        '200': { description: Closed, content: { application/json: { schema: { $ref: '#/components/schemas/PeriodCloseResult' } } } }
        '400': { description: Unposted vouchers / prior periods open / already closed }
        '403': { description: Lacks close permission }
  /v1/periods/{period}/reopen:
    post:
      operationId: reopenPeriod
      summary: 反结账 — 红冲 the 结转 voucher + reopen
      tags: [periods]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: period, in: path, required: true, schema: { type: string, example: '2026-06' } }]
      responses:
        '200': { description: Reopened, content: { application/json: { schema: { $ref: '#/components/schemas/PeriodClose' } } } }
        '400': { description: Not closed / later periods still closed }
  /v1/cash-flow-items:
    get:
      operationId: listCashFlowItems
      summary: List 现金流量项目
      tags: [cash-flow]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Items
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/CashFlowItem' } } } }
  /v1/cash-flow-items/seed-standard:
    post:
      operationId: seedStandardCashFlowItems
      summary: Seed the 《小企业准则》 CF items + chart defaults (idempotent)
      tags: [cash-flow]
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Seeded, content: { application/json: { schema: { type: object, properties: { seeded: { type: integer } } } } } }
  /v1/cash-flow/untagged:
    get:
      operationId: listUntaggedCashFlows
      summary: Pre-close worklist — untagged non-cash lines of cash vouchers
      tags: [cash-flow]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: period, in: query, required: false, schema: { type: string, example: '2026-06' } }]
      responses:
        '200':
          description: Untagged lines
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/UntaggedCashLine' } } } }
  /v1/cash-flow/tie-out:
    get:
      operationId: getCashFlowTieOut
      summary: CF tie-out — tagged flows == net cash change over a range
      tags: [cash-flow]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: from, in: query, required: false, schema: { type: string, format: date } }
        - { name: to, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200': { description: Tie-out, content: { application/json: { schema: { $ref: '#/components/schemas/CashFlowTieOut' } } } }
  /v1/opening-balances:
    get:
      operationId: getOpeningBalances
      summary: Opening balances (期初余额) + the ledger's enabled period
      tags: [opening-balances]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Opening balances
          content: { application/json: { schema: { $ref: '#/components/schemas/OpeningBalances' } } }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Ledger not in org / lacks read }
    put:
      operationId: setOpeningBalances
      summary: Set the enabled period + replace opening balances (期初建账)
      description: |
        Enforces 启用期试算平衡 (借=贷), every account active + leaf, and that the book
        has not yet been used (no posted/reversed vouchers). Replaces the whole set.
      tags: [opening-balances]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SetOpeningBalances' } } }
      responses:
        '200':
          description: Saved
          content: { application/json: { schema: { $ref: '#/components/schemas/OpeningBalances' } } }
        '400': { description: Unbalanced / invalid / book already used }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Lacks permission }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        HS256 dev token (P0b mock identity). Carries sub/orgId/ledgerBookId
        (+ optional email). Roles are resolved from Membership, not the token.
        Real Logto (OIDC/JWKS) replaces the verifier later.
  schemas:
    HealthStatus:
      type: object
      required: [status, service, time]
      properties:
        status: { type: string, example: ok }
        service: { type: string }
        time: { type: string, format: date-time }
    Organization:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time }
    LedgerBook:
      type: object
      required: [id, orgId, name, baseCurrency, fiscalYear, periodStructure, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        name: { type: string }
        baseCurrency: { type: string, example: CNY }
        fiscalYear: { type: integer, example: 2026 }
        periodStructure: { type: string, example: '12+1' }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    CreateLedgerBook:
      type: object
      required: [name, baseCurrency, fiscalYear]
      properties:
        name: { type: string }
        baseCurrency: { type: string, example: CNY }
        fiscalYear: { type: integer, example: 2026 }
        periodStructure: { type: string, example: '12+1' }
    Role:
      type: string
      enum: [accountant, cashier, supervisor, admin, viewer]
    Membership:
      type: object
      required: [id, orgId, userId, role, createdAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        userId: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        email: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    Invitation:
      type: object
      required: [id, orgId, invitedEmail, role, status, invitedBy, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        invitedEmail: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        token: { type: string, description: 'Secret; present only in the create response, never in listings' }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        invitedBy: { type: string }
        expiresAt: { type: string, format: date-time }
        acceptedBy: { type: string, nullable: true }
        acceptedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    CreateInvitation:
      type: object
      required: [email, role]
      properties:
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    AcceptInvitation:
      type: object
      required: [token]
      properties:
        token: { type: string }
    WorkItemStatus:
      type: string
      enum: [open, claimed, waiting, returned, completed, canceled]
    PlatformSubStatus:
      type: string
      enum:
        - pending_completion
        - pending_confirmation
        - pending_review
        - pending_correction
        - pending_external
        - pending_system
        - blocked
        - ready
        - done
    WorkItemAction:
      type: string
      enum: [claim, complete, return, assign, cancel]
    WorkItemPriority:
      type: string
      enum: [low, normal, high, urgent]
    WorkItem:
      type: object
      required:
        - id
        - orgId
        - ledgerBookId
        - moduleKey
        - workflowKey
        - workflowVersion
        - workItemType
        - sourceType
        - sourceId
        - status
        - subStatus
        - priority
        - assignedRole
        - assigneeUserId
        - availableAt
        - createdBy
        - version
        - titleKey
        - metadata
        - createdAt
        - updatedAt
        - availableActions
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        ledgerBookId: { type: string, format: uuid, nullable: true }
        moduleKey: { type: string, example: finance }
        workflowKey: { type: string, example: daily-accounting }
        workflowVersion: { type: string, example: v1 }
        workItemType: { type: string, example: voucher.review }
        sourceType: { type: string, example: JournalVoucher }
        sourceId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/WorkItemStatus' }
        subStatus:
          oneOf:
            - { $ref: '#/components/schemas/PlatformSubStatus' }
            - { type: string }
        priority: { $ref: '#/components/schemas/WorkItemPriority' }
        assignedRole: { type: string, example: supervisor }
        assigneeUserId: { type: string, nullable: true }
        claimedAt: { type: string, format: date-time, nullable: true }
        availableAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        canceledAt: { type: string, format: date-time, nullable: true }
        createdBy: { type: string }
        completedBy: { type: string, nullable: true }
        version: { type: integer }
        titleKey: { type: string }
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: Metadata-only; must not contain amounts, account lines, bank details, counterparties, summaries, attachments, OCR text, or comments.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        availableActions:
          type: array
          items: { $ref: '#/components/schemas/WorkItemAction' }
    WorkItemActionRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          description: Optimistic concurrency version from the WorkItem response.
        confirmSinglePerson:
          type: boolean
          description: Required only when single-person mode allows a maker to post their own voucher.
        reason:
          type: string
    Account:
      type: object
      required: [id, ledgerBookId, code, name, category, direction, level, isLeaf, auxTypes, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        ledgerBookId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        category: { type: string, enum: [asset, liability, equity, cost, profitLoss] }
        direction: { type: string, enum: [debit, credit] }
        parentCode: { type: string, nullable: true }
        level: { type: integer }
        isLeaf: { type: boolean }
        auxTypes: { type: array, items: { type: string, enum: [customer, supplier, department, project] } }
        active: { type: boolean }
        defaultCashFlowItem: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    CreateAccount:
      type: object
      required: [code, name, category, direction]
      properties:
        code: { type: string, description: 'Numeric; longer codes nest under shorter ones' }
        name: { type: string }
        category: { type: string, enum: [asset, liability, equity, cost, profitLoss] }
        direction: { type: string, enum: [debit, credit] }
        parentCode: { type: string }
        auxTypes: { type: array, items: { type: string, enum: [customer, supplier, department, project] } }
    VoucherLine:
      type: object
      required: [accountCode, summary]
      properties:
        accountCode: { type: string }
        accountName: { type: string, description: 'Denormalized from the chart (server-set)' }
        summary: { type: string }
        debit: { type: string, nullable: true, description: '2dp; exactly one of debit/credit' }
        credit: { type: string, nullable: true }
        cashFlowItem: { type: string, nullable: true }
    Voucher:
      type: object
      required: [id, ledgerBookId, no, date, period, status, summary, totalDebit, totalCredit, maker, lines]
      properties:
        id: { type: string, format: uuid }
        ledgerBookId: { type: string, format: uuid }
        no: { type: string }
        date: { type: string, format: date }
        period: { type: string, example: '2026-06' }
        status: { type: string, enum: [draft, pending, posted, reversed] }
        summary: { type: string }
        totalDebit: { type: string }
        totalCredit: { type: string }
        maker: { type: string }
        checker: { type: string, nullable: true }
        postedAt: { type: string, format: date-time, nullable: true }
        reversalOf: { type: string, format: uuid, nullable: true }
        reversedBy: { type: string, format: uuid, nullable: true }
        attachments: { type: integer }
        lines:
          type: array
          items: { $ref: '#/components/schemas/VoucherLine' }
    CreateVoucher:
      type: object
      required: [date, summary, lines]
      properties:
        date: { type: string, format: date }
        summary: { type: string }
        lines:
          type: array
          items:
            type: object
            required: [accountCode]
            properties:
              accountCode: { type: string }
              summary: { type: string }
              debit: { type: string }
              credit: { type: string }
              cashFlowItem: { type: string }
    ExtractionField:
      type: object
      required: [value, confidence]
      properties:
        value: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
    ExtractionResult:
      type: object
      description: 'ERP-internal extractor output; financial detail allowed, never sent to My-Chat.'
      required: [docType, fields, confidence, needsReview, extractor]
      properties:
        docType: { type: string, enum: [bank_slip, invoice, receipt, unknown] }
        fields:
          type: object
          properties:
            date: { $ref: '#/components/schemas/ExtractionField' }
            amount: { $ref: '#/components/schemas/ExtractionField' }
            direction: { $ref: '#/components/schemas/ExtractionField' }
            counterparty: { $ref: '#/components/schemas/ExtractionField' }
            summary: { $ref: '#/components/schemas/ExtractionField' }
            docNo: { $ref: '#/components/schemas/ExtractionField' }
        confidence: { type: number, minimum: 0, maximum: 1 }
        needsReview: { type: boolean }
        raw: { type: string }
        extractor:
          type: object
          required: [name, version]
          properties: { name: { type: string }, version: { type: string } }
    Intake:
      type: object
      required: [id, orgId, ledgerBookId, source, kind, status, needsReview, createdBy, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        ledgerBookId: { type: string, format: uuid }
        source: { type: string, enum: [web, chat, email, api] }
        kind: { type: string, enum: [image, pdf, text, structured] }
        status: { type: string, enum: [received, extracting, extracted, drafted, confirmed, discarded, failed] }
        attachmentId: { type: string, format: uuid, nullable: true }
        extraction: { allOf: [{ $ref: '#/components/schemas/ExtractionResult' }], nullable: true }
        confidence: { type: number, minimum: 0, maximum: 1, nullable: true }
        needsReview: { type: boolean }
        targetType: { type: string, nullable: true }
        targetId: { type: string, format: uuid, nullable: true }
        createdBy: { type: string }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CaptureIntake:
      type: object
      required: [kind, contentType, contentBase64]
      properties:
        source: { type: string, enum: [web, chat, email, api], default: web }
        kind: { type: string, enum: [image, pdf, text, structured] }
        contentType: { type: string }
        contentBase64: { type: string, description: 'Base64-encoded attachment bytes (≤10MB).' }
        channelRef: { type: string, description: 'Opaque correlation to the source message; no content.' }
    PeriodClose:
      type: object
      required: [period, status]
      properties:
        period: { type: string, example: '2026-06' }
        status: { type: string, enum: [open, closed] }
        closeVoucherId: { type: string, format: uuid, nullable: true }
        closedBy: { type: string, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }
        reopenedAt: { type: string, format: date-time, nullable: true }
    PeriodCloseReadiness:
      type: object
      required: [period, status, unpostedCount, unclosedPriorPeriods, untaggedCashFlowCount, canClose]
      properties:
        period: { type: string }
        status: { type: string, enum: [open, closed] }
        unpostedCount: { type: integer }
        unclosedPriorPeriods: { type: array, items: { type: string } }
        untaggedCashFlowCount: { type: integer }
        canClose: { type: boolean }
    CashFlowItem:
      type: object
      required: [code, name, activity, direction]
      properties:
        code: { type: string }
        name: { type: string }
        activity: { type: string, enum: [operating, investing, financing] }
        direction: { type: string, enum: [inflow, outflow] }
        sort: { type: integer }
        active: { type: boolean }
    UntaggedCashLine:
      type: object
      required: [voucherId, voucherNo, date, accountCode, accountName]
      properties:
        voucherId: { type: string, format: uuid }
        voucherNo: { type: string }
        date: { type: string, format: date }
        accountCode: { type: string }
        accountName: { type: string }
        debit: { type: string, nullable: true }
        credit: { type: string, nullable: true }
        summary: { type: string }
    CashFlowTieOut:
      type: object
      required: [cashNetChange, taggedFlows, difference, tied]
      properties:
        cashNetChange: { type: string }
        taggedFlows: { type: string }
        difference: { type: string }
        tied: { type: boolean }
    PeriodCloseResult:
      allOf:
        - $ref: '#/components/schemas/PeriodClose'
        - type: object
          properties:
            netProfit: { type: string, description: '净利润 (signed; positive = profit)' }
    TrialBalanceRow:
      type: object
      required: [accountCode, accountName, openingDebit, openingCredit, periodDebit, periodCredit, closingDebit, closingCredit]
      properties:
        accountCode: { type: string }
        accountName: { type: string }
        openingDebit: { type: string }
        openingCredit: { type: string }
        periodDebit: { type: string }
        periodCredit: { type: string }
        closingDebit: { type: string }
        closingCredit: { type: string }
    TrialBalanceTotals:
      type: object
      required: [openingDebit, openingCredit, periodDebit, periodCredit, closingDebit, closingCredit]
      properties:
        openingDebit: { type: string }
        openingCredit: { type: string }
        periodDebit: { type: string }
        periodCredit: { type: string }
        closingDebit: { type: string }
        closingCredit: { type: string }
    TrialBalance:
      type: object
      required: [rows, totals, balanced]
      properties:
        rows: { type: array, items: { $ref: '#/components/schemas/TrialBalanceRow' } }
        totals: { $ref: '#/components/schemas/TrialBalanceTotals' }
        balanced:
          type: object
          properties:
            opening: { type: boolean }
            period: { type: boolean }
            closing: { type: boolean }
    LedgerBalance:
      type: object
      properties:
        debit: { type: string }
        credit: { type: string }
        balance: { type: string }
        balanceDir: { type: string, enum: ['借', '贷', '平'] }
    OpeningBalanceItem:
      type: object
      required: [accountCode, accountName]
      properties:
        accountCode: { type: string }
        accountName: { type: string }
        debit: { type: string, nullable: true }
        credit: { type: string, nullable: true }
    OpeningBalances:
      type: object
      required: [openingPeriod, balances]
      properties:
        openingPeriod: { type: string, nullable: true, example: '2026-06' }
        balances: { type: array, items: { $ref: '#/components/schemas/OpeningBalanceItem' } }
    SetOpeningBalances:
      type: object
      required: [openingPeriod, balances]
      properties:
        openingPeriod: { type: string, example: '2026-06' }
        balances:
          type: array
          items:
            type: object
            required: [accountCode]
            properties:
              accountCode: { type: string }
              debit: { type: string }
              credit: { type: string }
    AccountLedger:
      type: object
      required: [accountCode, accountName, opening, rows, closing]
      properties:
        accountCode: { type: string }
        accountName: { type: string }
        opening: { $ref: '#/components/schemas/LedgerBalance' }
        closing: { $ref: '#/components/schemas/LedgerBalance' }
        rows:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              voucherNo: { type: string }
              voucherId: { type: string, format: uuid }
              summary: { type: string }
              debit: { type: string }
              credit: { type: string }
              balance: { type: string }
              balanceDir: { type: string, enum: ['借', '贷', '平'] }
