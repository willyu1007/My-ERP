        '200': { description: Contract, content: { application/json: { schema: { $ref: '#/components/schemas/Contract' } } } }
        '404': { description: Not found }
    patch:
      operationId: updateContract
      summary: Update a contract (status / fields; version-guarded)
      tags: [contracts]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateContract' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Contract' } } } }
        '400': { description: Invalid / closed contract }
        '409': { description: Stale version }
  /v1/contracts/{id}/timeline:
    get:
      operationId: getContractTimeline
      summary: 合同时间线 — contract event ∪ linked vouchers ∪ payments (time-ordered)
      tags: [contracts]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Timeline, content: { application/json: { schema: { $ref: '#/components/schemas/ContractTimeline' } } } }
        '404': { description: Not found }
  /v1/business-partners:
    get:
      operationId: listBusinessPartners
      summary: List 往来单位 (BusinessPartner) — searchable by name/wechat
      tags: [business-partners]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: active, in: query, required: false, schema: { type: boolean } }
        - { name: partyType, in: query, required: false, schema: { type: string, enum: [organization, individual] } }
        - { name: role, in: query, required: false, schema: { type: string, enum: [customer, supplier, employee, reimbursee, contractor, shareholder, other] } }
        - { name: q, in: query, required: false, schema: { type: string }, description: 'Name/wechat substring search' }
      responses:
        '200': { description: Partners, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/BusinessPartner' } } } } }
    post:
      operationId: createBusinessPartner
      summary: Create a 往来单位 (org-entered; non-member individuals need explicit confirmation)
      tags: [business-partners]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateBusinessPartner' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessPartner' } } } }
        '400': { description: Invalid input / unconfirmed non-member individual }
  /v1/business-partners/{id}:
    get:
      operationId: getBusinessPartner
      summary: Get a business partner
      tags: [business-partners]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Partner, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessPartner' } } } }
        '404': { description: Not found }
    patch:
      operationId: updateBusinessPartner
      summary: Update / deactivate a business partner (version-guarded; no physical delete)
      tags: [business-partners]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateBusinessPartner' } } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/BusinessPartner' } } } }
        '400': { description: Invalid input }
        '409': { description: Stale version }
  /v1/opening-balances:
    get:
      operationId: getOpeningBalances
      summary: Opening balances (期初余额) + the ledger's enabled period
      tags: [opening-balances]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Opening balances
          content: { application/json: { schema: { $ref: '#/components/schemas/OpeningBalances' } } }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Ledger not in org / lacks read }
    put:
      operationId: setOpeningBalances
      summary: Set the enabled period + replace opening balances (期初建账)
      description: |
        Enforces 启用期试算平衡 (借=贷), every account active + leaf, and that the book
        has not yet been used (no posted/reversed vouchers). Replaces the whole set.
      tags: [opening-balances]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SetOpeningBalances' } } }
      responses:
        '200':
          description: Saved
          content: { application/json: { schema: { $ref: '#/components/schemas/OpeningBalances' } } }
        '400': { description: Unbalanced / invalid / book already used }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Lacks permission }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        HS256 dev token (P0b mock identity). Carries sub/orgId/ledgerBookId
        (+ optional email). Roles are resolved from Membership, not the token.
        Real Logto (OIDC/JWKS) replaces the verifier later.
  schemas:
    HealthStatus:
      type: object
      required: [status, service, time]
      properties:
        status: { type: string, example: ok }
        service: { type: string }
        time: { type: string, format: date-time }
    Me:
      type: object
      required: [userId, orgId, roles, accountingCapable]
      properties:
        userId: { type: string }
        orgId: { type: string, format: uuid }
        ledgerBookId: { type: string, format: uuid, nullable: true }
        roles: { type: array, items: { type: string } }
        accountingCapable: { type: boolean, description: 'D8: may fill accounting subjects directly / enrich (post-Voucher right)' }
    Organization:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time }
    LedgerBook:
      type: object
      required: [id, orgId, name, baseCurrency, fiscalYear, periodStructure, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        name: { type: string }
        baseCurrency: { type: string, example: CNY }
        fiscalYear: { type: integer, example: 2026 }
        periodStructure: { type: string, example: '12+1' }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    CreateLedgerBook:
      type: object
      required: [name, baseCurrency, fiscalYear]
      properties:
        name: { type: string }
        baseCurrency: { type: string, example: CNY }
        fiscalYear: { type: integer, example: 2026 }
        periodStructure: { type: string, example: '12+1' }
    Role:
      type: string
      enum: [accountant, cashier, supervisor, admin, viewer]
    Membership:
      type: object
      required: [id, orgId, userId, role, createdAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        userId: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        email: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    Invitation:
      type: object
      required: [id, orgId, invitedEmail, role, status, invitedBy, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        invitedEmail: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        token: { type: string, description: 'Secret; present only in the create response, never in listings' }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        invitedBy: { type: string }
        expiresAt: { type: string, format: date-time }
        acceptedBy: { type: string, nullable: true }
        acceptedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    CreateInvitation:
      type: object
      required: [email, role]
      properties:
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    AcceptInvitation:
      type: object
      required: [token]
      properties:
        token: { type: string }
    WorkItemStatus:
      type: string
      enum: [open, claimed, waiting, returned, completed, canceled]
    PlatformSubStatus:
      type: string
      enum:
        - pending_completion
        - pending_confirmation
        - pending_review
        - pending_correction
        - pending_external
        - pending_system
        - blocked
        - ready
        - done
    WorkItemAction:
      type: string
      enum: [claim, complete, return, assign, cancel]
    WorkItemPriority:
      type: string
      enum: [low, normal, high, urgent]
    WorkItem:
      type: object
      required:
        - id
        - orgId
        - ledgerBookId
        - moduleKey
        - workflowKey
        - workflowVersion
        - workItemType
        - sourceType
        - sourceId
        - status
        - subStatus
        - priority
        - assignedRole
        - assigneeUserId
        - availableAt
        - createdBy
        - version
        - titleKey
        - metadata
        - createdAt
        - updatedAt
        - availableActions
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        ledgerBookId: { type: string, format: uuid, nullable: true }
        moduleKey: { type: string, example: finance }
        workflowKey: { type: string, example: daily-accounting }
        workflowVersion: { type: string, example: v1 }
        workItemType: { type: string, example: voucher.review }
        sourceType: { type: string, example: JournalVoucher }
        sourceId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/WorkItemStatus' }
        subStatus:
          oneOf:
            - { $ref: '#/components/schemas/PlatformSubStatus' }
            - { type: string }
        priority: { $ref: '#/components/schemas/WorkItemPriority' }
        assignedRole: { type: string, example: supervisor }
        assigneeUserId: { type: string, nullable: true }
        claimedAt: { type: string, format: date-time, nullable: true }
        availableAt: { type: string, format: date-time }
        dueAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        canceledAt: { type: string, format: date-time, nullable: true }
        createdBy: { type: string }
        completedBy: { type: string, nullable: true }
        version: { type: integer }
        titleKey: { type: string }
        metadata:
          type: object
          nullable: true
          additionalProperties: true
          description: Metadata-only; must not contain amounts, account lines, bank details, counterparties, summaries, attachments, OCR text, or comments.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        availableActions:
          type: array
          items: { $ref: '#/components/schemas/WorkItemAction' }
    WorkItemActionRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          description: Optimistic concurrency version from the WorkItem response.
        confirmSinglePerson:
          type: boolean
          description: Required only when single-person mode allows a maker to post their own voucher.
        reason:
          type: string
    Account:
      type: object
      required: [id, ledgerBookId, code, name, category, direction, level, isLeaf, auxTypes, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        ledgerBookId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        category: { type: string, enum: [asset, liability, equity, cost, profitLoss] }
        direction: { type: string, enum: [debit, credit] }
        parentCode: { type: string, nullable: true }
        level: { type: integer }
        isLeaf: { type: boolean }
        auxTypes: { type: array, items: { type: string, enum: [customer, supplier, department, project] } }
        active: { type: boolean }
        defaultCashFlowItem: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    ChartTemplateAccount:
      type: object
      required: [code, name, category, direction, parentCode, level, isLeaf]
      properties:
        code: { type: string }
        name: { type: string }
        category: { type: string, enum: [asset, liability, equity, cost, profitLoss] }
        direction: { type: string, enum: [debit, credit] }
        parentCode: { type: string, nullable: true }
        level: { type: integer }
        isLeaf: { type: boolean }
        auxTypes: { type: array, items: { type: string, enum: [customer, supplier, department, project] } }
    StandardChartDiff:
      type: object
      required: [chartVersion, additions, parentConversions, conflicts, present]
      properties:
        chartVersion: { type: integer }
        additions: { type: array, items: { $ref: '#/components/schemas/ChartTemplateAccount' } }
        parentConversions:
          type: array
          description: Existing activity-free leaves that would become branches
          items:
            type: object
            required: [code, name]
            properties: { code: { type: string }, name: { type: string } }
        conflicts:
          type: array
          description: Template accounts skipped because their parent is a posted leaf
          items:
            type: object
            required: [code, name, reason]
            properties: { code: { type: string }, name: { type: string }, reason: { type: string } }
        present: { type: integer }
    StandardChartImportResult:
      type: object
      required: [chartVersion, added, convertedParents, conflicts]
      properties:
        chartVersion: { type: integer }
        added: { type: integer }
        convertedParents: { type: integer }
        conflicts:
          type: array
          items:
            type: object
            required: [code, name, reason]
            properties: { code: { type: string }, name: { type: string }, reason: { type: string } }
    AccountPreferences:
      type: object
      required: [recommended, pinned, hidden]
      description: Display-only picker preferences (T-012 D5) — never affect account validity or posting
      properties:
        recommended: { type: array, items: { type: string }, description: Ledger default (team) }
        pinned: { type: array, items: { type: string }, description: Personal favorites }
        hidden: { type: array, items: { type: string }, description: Personal less-shown (still searchable) }
    CreateAccount:
      type: object
      required: [code, name, category, direction]
      properties:
        code: { type: string, description: 'Numeric; longer codes nest under shorter ones' }
        name: { type: string }
        category: { type: string, enum: [asset, liability, equity, cost, profitLoss] }
        direction: { type: string, enum: [debit, credit] }
        parentCode: { type: string }
        auxTypes: { type: array, items: { type: string, enum: [customer, supplier, department, project] } }
    VoucherLine:
      type: object
      required: [accountCode, summary]
      properties:
        accountCode: { type: string }
        accountName: { type: string, description: 'Denormalized from the chart (server-set)' }
        summary: { type: string }
        debit: { type: string, nullable: true, description: '2dp; exactly one of debit/credit' }
        credit: { type: string, nullable: true }
        cashFlowItem: { type: string, nullable: true }
    FastEntryDraftPayload:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, enum: [1] }
        summary: { type: string, maxLength: 500 }
        contractId: { type: string, format: uuid, nullable: true }
        lines:
          type: array
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            properties:
              accountCode: { type: string, maxLength: 64 }
              accountName: { type: string, maxLength: 120 }
              summary: { type: string, maxLength: 500 }
              debit: { type: string, description: '2dp draft amount, optional' }
              credit: { type: string, description: '2dp draft amount, optional' }
              cashFlowItem: { type: string, maxLength: 64 }
    Voucher:
      type: object
      required: [id, ledgerBookId, no, date, period, status, summary, totalDebit, totalCredit, maker, lines]
      properties:
        id: { type: string, format: uuid }
        ledgerBookId: { type: string, format: uuid }
        no: { type: string }
        date: { type: string, format: date }
        period: { type: string, example: '2026-06' }
        status: { type: string, enum: [draft, pending, posted, reversed] }
        summary: { type: string }
        totalDebit: { type: string }
        totalCredit: { type: string }
        maker: { type: string }
        checker: { type: string, nullable: true }
        postedAt: { type: string, format: date-time, nullable: true }
        reversalOf: { type: string, format: uuid, nullable: true }
        reversedBy: { type: string, format: uuid, nullable: true }
        attachments: { type: integer }
        contractId: { type: string, format: uuid, nullable: true, description: 'Contract link (T-005)' }
        draftPayload:
          allOf:
            - $ref: '#/components/schemas/FastEntryDraftPayload'
          nullable: true
        lines:
          type: array
          items: { $ref: '#/components/schemas/VoucherLine' }
    CreateVoucher:
      type: object
      required: [date]
      properties:
        date: { type: string, format: date }
        summary: { type: string }
        contractId: { type: string, format: uuid, nullable: true, description: 'Optional Contract link (T-005)' }
        draftPayload:
          allOf:
            - $ref: '#/components/schemas/FastEntryDraftPayload'
          nullable: true
        lines:
          type: array
          items:
            type: object
            properties:
              accountCode: { type: string }
              summary: { type: string }
              debit: { type: string }
              credit: { type: string }
              cashFlowItem: { type: string }
    ExtractionField:
      type: object
      required: [value, confidence]
      properties:
        value: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
    ExtractionResult:
      type: object
      description: 'ERP-internal extractor output; financial detail allowed, never sent to My-Chat.'
      required: [docType, fields, confidence, needsReview, extractor]
      properties:
        docType: { type: string, enum: [bank_slip, invoice, receipt, unknown] }
        fields:
          type: object
          properties:
            date: { $ref: '#/components/schemas/ExtractionField' }
            amount: { $ref: '#/components/schemas/ExtractionField' }
            direction: { $ref: '#/components/schemas/ExtractionField' }
            counterparty: { $ref: '#/components/schemas/ExtractionField' }
            summary: { $ref: '#/components/schemas/ExtractionField' }
            docNo: { $ref: '#/components/schemas/ExtractionField' }
        confidence: { type: number, minimum: 0, maximum: 1 }
        needsReview: { type: boolean }
        raw: { type: string }
        extractor:
          type: object
          required: [name, version]
          properties: { name: { type: string }, version: { type: string } }
    Intake:
      type: object
      required: [id, orgId, ledgerBookId, source, kind, status, needsReview, createdBy, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        ledgerBookId: { type: string, format: uuid }
        source: { type: string, enum: [web, chat, email, api] }
        kind: { type: string, enum: [image, pdf, text, structured] }
        status: { type: string, enum: [received, extracting, extracted, drafted, confirmed, discarded, failed] }
        attachmentId: { type: string, format: uuid, nullable: true }
        extraction: { allOf: [{ $ref: '#/components/schemas/ExtractionResult' }], nullable: true }
        confidence: { type: number, minimum: 0, maximum: 1, nullable: true }
        needsReview: { type: boolean }
        targetType: { type: string, nullable: true }
        targetId: { type: string, format: uuid, nullable: true }
        createdBy: { type: string }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CaptureIntake:
      type: object
      required: [kind, contentType, contentBase64]
      properties:
        source: { type: string, enum: [web, chat, email, api], default: web }
        kind: { type: string, enum: [image, pdf, text, structured] }
        contentType: { type: string }
        contentBase64: { type: string, description: 'Base64-encoded attachment bytes (≤10MB).' }
        channelRef: { type: string, description: 'Opaque correlation to the source message; no content.' }
    PeriodClose:
      type: object
      required: [period, status]
      properties:
        period: { type: string, example: '2026-06' }
        status: { type: string, enum: [open, closed] }
        closeVoucherId: { type: string, format: uuid, nullable: true }
        closedBy: { type: string, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }
        reopenedAt: { type: string, format: date-time, nullable: true }
    PeriodCloseReadiness:
      type: object
      required: [period, status, unpostedCount, unclosedPriorPeriods, untaggedCashFlowCount, canClose]
      properties:
        period: { type: string }
        status: { type: string, enum: [open, closed] }
        unpostedCount: { type: integer }
        unclosedPriorPeriods: { type: array, items: { type: string } }
        untaggedCashFlowCount: { type: integer }
        canClose: { type: boolean }
    CashFlowItem:
      type: object
      required: [code, name, activity, direction]
      properties:
        code: { type: string }
        name: { type: string }
        activity: { type: string, enum: [operating, investing, financing] }
        direction: { type: string, enum: [inflow, outflow] }
        sort: { type: integer }
        active: { type: boolean }
    UntaggedCashLine:
      type: object
      required: [voucherId, voucherNo, date, accountCode, accountName]
      properties:
        voucherId: { type: string, format: uuid }
        voucherNo: { type: string }
        date: { type: string, format: date }
        accountCode: { type: string }
        accountName: { type: string }
        debit: { type: string, nullable: true }
        credit: { type: string, nullable: true }
        summary: { type: string }
    CashFlowTieOut:
      type: object
      required: [cashNetChange, taggedFlows, difference, tied]
      properties:
        cashNetChange: { type: string }
        taggedFlows: { type: string }
        difference: { type: string }
        tied: { type: boolean }
    TagCashFlow:
      type: object
      required: [voucherId, accountCode]
      properties:
        voucherId: { type: string, format: uuid }
        accountCode: { type: string, description: 'Non-cash (contra) account to tag' }
        cashFlowItem: { type: string, nullable: true, description: 'CF item code; null/empty clears the tag' }
    PaymentDoc:
      type: object
      required: [id, no, direction, date, period, counterparty, summary, amount, status, maker, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        no: { type: string, example: 收-2026-06-001 }
        direction: { type: string, enum: [receipt, payment] }
        date: { type: string, format: date }
        period: { type: string, example: 2026-06 }
        counterparty: { type: string, description: 'Immutable display snapshot (T-012)' }
        partnerId: { type: string, format: uuid, nullable: true, description: 'Optional BusinessPartner link (T-012)' }
        summary: { type: string }
        amount: { type: string, description: '2dp' }
        cashAccountCode: { type: string, nullable: true, description: 'Null until accounting enrichment (T-012 Phase 3 cashier path)' }
        contraAccountCode: { type: string, nullable: true }
        contraAux: { type: object, additionalProperties: true, nullable: true, description: '辅助核算 for the contra line, keyed by AuxType (T-012 Phase 3)' }
        cashFlowItem: { type: string, nullable: true, description: '现金流量项目 code for the contra line (T-012 Phase 3)' }
        status: { type: string, enum: [pending_accounting, draft, pending_approval, approved, confirmed, void] }
        settlementVoucherId: { type: string, format: uuid, nullable: true }
        contractId: { type: string, format: uuid, nullable: true, description: 'Reserved for T-005' }
        maker: { type: string }
        approver: { type: string, nullable: true }
        confirmer: { type: string, nullable: true }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreatePayment:
      type: object
      required: [direction, date, summary, amount]
      properties:
        direction: { type: string, enum: [receipt, payment] }
        date: { type: string, format: date }
        counterparty: { type: string, description: 'Required unless partnerId resolves it (T-012)' }
        partnerId: { type: string, format: uuid, nullable: true, description: 'Optional BusinessPartner link (T-012); must be active and in-scope' }
        summary: { type: string }
        amount: { type: string, description: 'positive, ≤2dp' }
        cashAccountCode: { type: string, description: '货币资金类 (1001/1002/1012). Omit on the cashier path (T-012 Phase 3, D3); accounting-capable roles may set it directly.' }
        contraAccountCode: { type: string, description: '对方科目. Omit on the cashier path.' }
        contraAux: { type: object, additionalProperties: true, description: 'Direct-path enrichment: 辅助核算 for the contra line (T-012 Phase 3)' }
        cashFlowItem: { type: string, description: 'Direct-path enrichment: 现金流量项目 code for the contra line' }
        contractId: { type: string, format: uuid, nullable: true, description: 'Optional Contract link (T-005)' }
    EnrichPayment:
      type: object
      required: [expectedVersion, cashAccountCode, contraAccountCode]
      description: 'Accountant completion of a cashier doc (T-012 Phase 3, D3/D7). No voucher — that is confirm.'
      properties:
        expectedVersion: { type: integer }
        cashAccountCode: { type: string, description: '货币资金类' }
        contraAccountCode: { type: string, description: '对方科目' }
        contraAux: { type: object, additionalProperties: true, description: '辅助核算 for the contra line, keyed by AuxType (optional)' }
        cashFlowItem: { type: string, description: '现金流量项目 code for the contra line (optional; auto-suggested from the account)' }
    PaymentActionRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, description: 'Optimistic concurrency version' }
    PaymentConfirmRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer }
        confirmSinglePerson: { type: boolean, description: 'Required for a maker self-confirm in single-person mode' }
    PaymentVoidRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer }
        reason: { type: string }
    PaymentConfirmResult:
      allOf:
        - $ref: '#/components/schemas/PaymentDoc'
        - type: object
          properties:
            settlementVoucher: { $ref: '#/components/schemas/Voucher' }
    FundConsumption:
      type: object
      description: 'A cashier fund-execution task over one cash/bank line of a posted voucher (T-012 Phase 4, D4). Has NO ledger columns — consuming it never posts a voucher.'
      required: [id, ledgerBookId, orgId, voucherId, voucherLineId, voucherNo, lineNo, accountCode, accountName, direction, amount, counterparty, summary, executionStatus, reconciliationStatus, createdBy, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        ledgerBookId: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        voucherId: { type: string, format: uuid, description: 'The posted source voucher' }
        voucherLineId: { type: string, format: uuid, description: 'The cash/bank line this task tracks (one task per line)' }
        voucherNo: { type: string }
        lineNo: { type: integer }
        accountCode: { type: string, description: '货币资金类 (1001/1002/1012 subtree)' }
        accountName: { type: string }
        direction: { type: string, enum: [inflow, outflow], description: 'inflow = debit to cash; outflow = credit' }
        amount: { type: string, description: '2dp' }
        counterparty: { type: string }
        summary: { type: string }
        executionStatus: { type: string, enum: [pending, executed, skipped, void] }
        bankFlowRef: { type: string, nullable: true, description: 'Bank流水号 / settlement reference' }
        reconciliationStatus: { type: string, enum: [unreconciled, reconciled] }
        attachmentId: { type: string, nullable: true }
        workItemId: { type: string, format: uuid, nullable: true, description: 'The paired fund.consume work item' }
        executedBy: { type: string, nullable: true }
        executedAt: { type: string, format: date-time, nullable: true }
        reconciledBy: { type: string, nullable: true }
        reconciledAt: { type: string, format: date-time, nullable: true }
        createdBy: { type: string }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ConsumeFundConsumption:
      type: object
      required: [expectedVersion, executionStatus]
      properties:
        expectedVersion: { type: integer, description: 'Optimistic concurrency version' }
        executionStatus: { type: string, enum: [executed, skipped], description: 'executed = money moved; skipped = pure bookkeeping / no cashier movement' }
        bankFlowRef: { type: string, nullable: true, description: '银行流水号 / 结算参考. The receipt attachment has its own endpoint (POST :id/attachment); reconciliation is a future action, not set here.' }
    UploadFundReceipt:
      type: object
      required: [contentType, contentBase64]
      description: 'Bank-receipt evidence for a fund line (T-014). image/* or application/pdf, ≤10MB.'
      properties:
        contentType: { type: string, example: image/jpeg, description: 'image/* or application/pdf' }
        contentBase64: { type: string, description: 'Base64-encoded receipt bytes (≤10MB)' }
    Contract:
      type: object
      required: [id, ledgerBookId, code, title, type, counterparty, currency, status, summary, createdBy, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        ledgerBookId: { type: string, format: uuid }
        code: { type: string, example: HT-2026-001 }
        title: { type: string }
        type: { type: string, enum: [sales, purchase, service, other] }
        counterparty: { type: string, description: 'Immutable display snapshot (T-012)' }
        partnerId: { type: string, format: uuid, nullable: true, description: 'Optional BusinessPartner link (T-012)' }
        amount: { type: string, nullable: true }
        currency: { type: string }
        status: { type: string, enum: [draft, active, closed] }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        summary: { type: string }
        createdBy: { type: string }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateContract:
      type: object
      required: [title]
      properties:
        title: { type: string }
        type: { type: string, enum: [sales, purchase, service, other] }
        counterparty: { type: string }
        partnerId: { type: string, format: uuid, nullable: true, description: 'Optional BusinessPartner link (T-012); must be active and in-scope' }
        amount: { type: string, nullable: true }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        summary: { type: string }
    UpdateContract:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer }
        title: { type: string }
        type: { type: string, enum: [sales, purchase, service, other] }
        counterparty: { type: string }
        partnerId: { type: string, format: uuid, nullable: true, description: 'Set to link (refreshes the snapshot unless counterparty is also given); null to unlink' }
        amount: { type: string, nullable: true }
        status: { type: string, enum: [draft, active, closed] }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        summary: { type: string }
    BusinessPartner:
      type: object
      required: [id, ledgerBookId, partyType, name, roles, tags, wechat, remark, active, createdBy, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        ledgerBookId: { type: string, format: uuid }
        partyType: { type: string, enum: [organization, individual] }
        name: { type: string, description: 'Org-entered display name (snapshot semantics, D10)' }
        roles: { type: array, items: { type: string, enum: [customer, supplier, employee, reimbursee, contractor, shareholder, other] } }
        tags: { type: array, items: { type: string }, description: 'Display/search-only labels' }
        memberUserId: { type: string, nullable: true, description: 'Optional org-member link for individuals (D2)' }
        wechat: { type: string, description: '微信号 — display/search-only contact PII' }
        remark: { type: string }
        active: { type: boolean, description: 'Deactivate instead of delete' }
        createdBy: { type: string }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    CreateBusinessPartner:
      type: object
      required: [partyType, name]
      properties:
        partyType: { type: string, enum: [organization, individual] }
        name: { type: string }
        roles: { type: array, items: { type: string, enum: [customer, supplier, employee, reimbursee, contractor, shareholder, other] } }
        tags: { type: array, items: { type: string } }
        memberUserId: { type: string, nullable: true, description: 'Individuals only; must be an org member' }
        wechat: { type: string }
        remark: { type: string }
        confirmNonMember: { type: boolean, description: 'Required true for individuals without memberUserId (D2)' }
    UpdateBusinessPartner:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer }
        partyType: { type: string, enum: [organization, individual] }
        name: { type: string }
        roles: { type: array, items: { type: string, enum: [customer, supplier, employee, reimbursee, contractor, shareholder, other] } }
        tags: { type: array, items: { type: string } }
        memberUserId: { type: string, nullable: true }
        wechat: { type: string }
        remark: { type: string }
        active: { type: boolean }
    TimelineItem:
      type: object
      required: [kind, date, title, summary, refType, refId]
      properties:
        kind: { type: string, enum: [contract, voucher, payment] }
        date: { type: string, format: date }
        title: { type: string }
        summary: { type: string }
        amount: { type: string, nullable: true }
        status: { type: string, nullable: true }
        refType: { type: string, enum: [Contract, JournalVoucher, PaymentDoc] }
        refId: { type: string }
    ContractTimeline:
      type: object
      required: [contract, items]
      properties:
        contract: { $ref: '#/components/schemas/Contract' }
        items:
          type: array
          items: { $ref: '#/components/schemas/TimelineItem' }
    PeriodCloseResult:
      allOf:
        - $ref: '#/components/schemas/PeriodClose'
        - type: object
          properties:
            netProfit: { type: string, description: '净利润 (signed; positive = profit)' }
    ReportLine:
      type: object
      required: [key, label, level, amount]
      properties:
        key: { type: string }
        label: { type: string }
        level: { type: integer }
        amount: { type: string }
    BalanceSheet:
      type: object
      required: [asOf, lines, balanced]
      properties:
        asOf: { type: string, format: date }
        lines: { type: array, items: { $ref: '#/components/schemas/ReportLine' } }
        balanced: { type: boolean }
    IncomeStatement:
      type: object
      required: [from, to, lines, netProfit]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        lines: { type: array, items: { $ref: '#/components/schemas/ReportLine' } }
        netProfit: { type: string }
    CashFlowStatement:
      type: object
      required: [from, to, activities, netCashFlow, beginningCash, endingCash, tied]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        activities:
          type: array
          items:
            type: object
            properties:
              activity: { type: string, enum: [operating, investing, financing] }
              subtotal: { type: string }
              lines:
                type: array
                items:
                  type: object
                  properties:
                    code: { type: string }
                    name: { type: string }
                    amount: { type: string }
        netCashFlow: { type: string }
        beginningCash: { type: string }
        endingCash: { type: string }
        tied: { type: boolean }
    TrialBalanceRow:
      type: object
      required: [accountCode, accountName, openingDebit, openingCredit, periodDebit, periodCredit, closingDebit, closingCredit]
      properties:
        accountCode: { type: string }
        accountName: { type: string }
        openingDebit: { type: string }
        openingCredit: { type: string }
        periodDebit: { type: string }
        periodCredit: { type: string }
        closingDebit: { type: string }
        closingCredit: { type: string }
    TrialBalanceTotals:
      type: object
      required: [openingDebit, openingCredit, periodDebit, periodCredit, closingDebit, closingCredit]
      properties:
        openingDebit: { type: string }
        openingCredit: { type: string }
        periodDebit: { type: string }
        periodCredit: { type: string }
        closingDebit: { type: string }
        closingCredit: { type: string }
    TrialBalance:
      type: object
      required: [rows, totals, balanced]
      properties:
        rows: { type: array, items: { $ref: '#/components/schemas/TrialBalanceRow' } }
        totals: { $ref: '#/components/schemas/TrialBalanceTotals' }
        balanced:
          type: object
          properties:
            opening: { type: boolean }
            period: { type: boolean }
            closing: { type: boolean }
    LedgerBalance:
      type: object
      properties:
        debit: { type: string }
        credit: { type: string }
        balance: { type: string }
        balanceDir: { type: string, enum: ['借', '贷', '平'] }
    OpeningBalanceItem:
      type: object
      required: [accountCode, accountName]
      properties:
        accountCode: { type: string }
        accountName: { type: string }
        debit: { type: string, nullable: true }
        credit: { type: string, nullable: true }
    OpeningBalances:
      type: object
      required: [openingPeriod, balances]
      properties:
        openingPeriod: { type: string, nullable: true, example: '2026-06' }
        balances: { type: array, items: { $ref: '#/components/schemas/OpeningBalanceItem' } }
    SetOpeningBalances:
      type: object
      required: [openingPeriod, balances]
      properties:
        openingPeriod: { type: string, example: '2026-06' }
        balances:
          type: array
          items:
            type: object
            required: [accountCode]
            properties:
              accountCode: { type: string }
              debit: { type: string }
              credit: { type: string }
    AccountLedger:
      type: object
      required: [accountCode, accountName, opening, rows, closing]
      properties:
        accountCode: { type: string }
        accountName: { type: string }
        opening: { $ref: '#/components/schemas/LedgerBalance' }
        closing: { $ref: '#/components/schemas/LedgerBalance' }
        rows:
          type: array
          items:
            type: object
            properties:
              date: { type: string, format: date }
              voucherNo: { type: string }
              voucherId: { type: string, format: uuid }
              summary: { type: string }
              debit: { type: string }
              credit: { type: string }
              balance: { type: string }
              balanceDir: { type: string, enum: ['借', '贷', '平'] }
