        - { name: status, in: query, required: false, schema: { type: string, enum: [draft, pending_approval, approved, confirmed, void] } }
        - { name: direction, in: query, required: false, schema: { type: string, enum: [receipt, payment] } }
        - { name: partnerId, in: query, required: false, schema: { type: string, format: uuid }, description: 'Filter by linked BusinessPartner (T-012)' }
      responses:
        '200': { description: Payment docs, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PaymentDoc' } } } } }
    post:
      operationId: createPayment
      summary: Create a 收/付款单 draft
      tags: [payments]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreatePayment' } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentDoc' } } } }
        '400': { description: Invalid input / closed period / bad account }
  /v1/payments/{id}:
    get:
      operationId: getPayment
      summary: Get a payment doc
      tags: [payments]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Payment doc, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentDoc' } } } }
        '404': { description: Not found }
  /v1/payments/{id}/enrich:
    post:
      operationId: enrichPayment
      summary: pending_accounting → pending_approval — accountant completes accounting facts (T-012 Phase 3, D3/D7)
      description: Sets cash/bank + contra subjects, the contra line's auxiliary dimensions, and the cash-flow item; advances to approval. Never generates a voucher (that is confirm). Requires post-Voucher rights (accounting-capable).
      tags: [payments]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EnrichPayment' } } } }
      responses:
        '200': { description: Enriched, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentDoc' } } } }
        '400': { description: Wrong status / closed period / invalid subject }
        '403': { description: Caller is not accounting-capable }
        '409': { description: Stale version }
  /v1/payments/{id}/submit:
    post:
      operationId: submitPayment
      summary: draft → pending_approval (opens the approver task)
      tags: [payments]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentActionRequest' } } } }
      responses:
        '200': { description: Submitted, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentDoc' } } } }
        '400': { description: Wrong status / closed period / not accounting-complete }
        '409': { description: Stale version }
  /v1/payments/{id}/approve:
    post:
      operationId: approvePayment
      summary: pending_approval → approved (SoD; opens the cashier task)
      tags: [payments]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentActionRequest' } } } }
      responses:
        '200': { description: Approved, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentDoc' } } } }
        '400': { description: Wrong status }
        '403': { description: Approver is the maker (SoD) }
        '409': { description: Stale version }
  /v1/payments/{id}/confirm:
    post:
      operationId: confirmPayment
      summary: approved → confirmed — generate + post the settlement voucher
      tags: [payments]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentConfirmRequest' } } } }
      responses:
        '200': { description: Confirmed, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentConfirmResult' } } } }
        '400': { description: Wrong status / closed period }
        '403': { description: Confirmer is the maker (SoD) }
        '409': { description: Stale version }
  /v1/payments/{id}/void:
    post:
      operationId: voidPayment
      summary: 作废 a pre-confirmed payment doc
      tags: [payments]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentVoidRequest' } } } }
      responses:
        '200': { description: Voided, content: { application/json: { schema: { $ref: '#/components/schemas/PaymentDoc' } } } }
        '400': { description: Already confirmed / void }
        '409': { description: Stale version }
  /v1/fund-consumptions:
    get:
      operationId: listFundConsumptions
      summary: List 资金执行任务 (FundConsumption) — cashier fund-execution queue (T-012 Phase 4, D4)
      description: One row per cash/bank line of a posted accountant/manual voucher. Consuming records that money actually moved; it never posts a second voucher. Requires read-FundConsumption (cashier-capable).
      tags: [fund-consumptions]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: voucherId, in: query, required: false, schema: { type: string, format: uuid }, description: 'Filter to one source voucher' }
        - { name: executionStatus, in: query, required: false, schema: { type: string, enum: [pending, executed, skipped, void] } }
        - { name: reconciliationStatus, in: query, required: false, schema: { type: string, enum: [unreconciled, reconciled] } }
        - { name: period, in: query, required: false, schema: { type: string, example: 2026-06 }, description: 'Source-voucher accounting period (T-013 queue filter)' }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100 }, description: 'Page size; omit for the full set (per-voucher panel reads)' }
        - { name: cursor, in: query, required: false, schema: { type: string, format: uuid }, description: 'Id of the last row of the previous page (workbench cursor convention)' }
      responses:
        '200': { description: Fund consumptions, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/FundConsumption' } } } } }
  /v1/fund-consumptions/pending-count:
    get:
      operationId: getFundConsumptionPendingCount
      summary: Open fund-execution workload for the ledger (queue badge / dashboard, T-013)
      tags: [fund-consumptions]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Pending count
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer }
  /v1/fund-consumptions/{id}:
    get:
      operationId: getFundConsumption
      summary: Get a fund-consumption row
      tags: [fund-consumptions]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Fund consumption, content: { application/json: { schema: { $ref: '#/components/schemas/FundConsumption' } } } }
        '404': { description: Not found }
  /v1/fund-consumptions/{id}/consume:
    post:
      operationId: consumeFundConsumption
      summary: pending → executed | skipped — cashier records fund movement (T-012 Phase 4, D4)
      description: Records execution (optional bank-flow reference) and completes the paired fund.consume task. The receipt attachment has its own endpoint (POST :id/attachment). NEVER posts a voucher or produces any ledger effect. Requires consume-FundConsumption (cashier-capable).
      tags: [fund-consumptions]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ConsumeFundConsumption' } } } }
      responses:
        '200': { description: Consumed, content: { application/json: { schema: { $ref: '#/components/schemas/FundConsumption' } } } }
        '400': { description: Wrong status / invalid executionStatus }
        '403': { description: Task claimed by another cashier }
        '409': { description: Stale version }
  /v1/fund-consumptions/{id}/attachment:
    post:
      operationId: uploadFundReceipt
      summary: 上传银行回单 — attach receipt evidence to a fund line (T-014)
      description: |
        Stores an image/PDF receipt in the object store + an Attachment row and points the
        fund line at it. Works at confirm-time AND after the fact (any non-void line).
        Deliberately does NOT go through the Intake flow: NO outbox event, NO OCR extraction —
        the receipt is sensitive financial detail and must never leak toward the ecosystem
        (AGENTS.md §3). Requires consume-FundConsumption (cashier-capable). Not version-guarded.
      tags: [fund-consumptions]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UploadFundReceipt' } } } }
      responses:
        '200': { description: Attached, content: { application/json: { schema: { $ref: '#/components/schemas/FundConsumption' } } } }
        '400': { description: Void line / not image or PDF / empty / exceeds 10MB }
        '404': { description: Fund line not found }
    get:
      operationId: getFundReceipt
      summary: View a fund line's bank receipt (streamed bytes, in-app)
      description: Streams the attached receipt bytes with its Content-Type (inline). Requires read-FundConsumption. Served as binary — consumed via a web route handler, not the JSON api-client.
      tags: [fund-consumptions]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Receipt bytes
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '404': { description: Fund line or receipt not found }
  /v1/contracts:
    get:
      operationId: listContracts
      summary: List 合同 (Contract)
      tags: [contracts]
      security: [{ bearerAuth: [] }]
