openapi: 3.1.0
info:
  title: My-ERP API
  version: 0.1.0
  description: |
    Canonical API contract for My-ERP (finance v1).
    After edits run:
      node .ai/skills/features/context-awareness/scripts/ctl-context.mjs touch
      node .ai/scripts/ctl-api-index.mjs generate --touch
servers:
  - url: http://localhost:8000
    description: Local development
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe (includes a DB ping)
      tags: [system]
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /v1/me:
    get:
      operationId: getMe
      summary: The caller's own identity + capabilities (T-012 Phase 3)
      tags: [identity]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Identity summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { description: Missing or invalid bearer token }
  /v1/organization:
    get:
      operationId: getCurrentOrganization
      summary: The caller's current organization (org-scoped)
      tags: [organization]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller has no membership in the organization
  /v1/ledger-books:
    get:
      operationId: listLedgerBooks
      summary: List ledger books in the caller's organization
      tags: [ledger-books]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ledger books (org-scoped)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LedgerBook'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller lacks read permission / no membership
    post:
      operationId: createLedgerBook
      summary: Create a ledger book (账套) — admin/supervisor only
      tags: [ledger-books]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLedgerBook'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerBook'
        '400':
          description: Invalid body
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller lacks create permission
  /v1/invitations:
    get:
      operationId: listInvitations
      summary: List invitations (admin/supervisor)
      tags: [invitations]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Invitations (org-scoped)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Invitation' }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Caller lacks invite permission }
    post:
      operationId: createInvitation
      summary: Invite a user by email with a role (admin/supervisor)
      tags: [invitations]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvitation' }
      responses:
        '201':
          description: Created (carries the secret token)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '400': { description: Invalid body }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Caller lacks invite permission }
  /v1/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation (authenticated invitee — not yet a member)
      description: |
        Authn-only (PrincipalGuard); the caller is not yet a member. Validates the
        secret token + invited email + state machine, then creates the Membership.
      tags: [invitations]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInvitation' }
      responses:
        '200':
          description: Membership created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '400': { description: Invalid/expired/mismatched invitation }
        '401': { description: Missing or invalid bearer token }
        '404': { description: Invitation not found }
        '409': { description: Already a member }
  /v1/invitations/{id}/revoke:
    post:
      operationId: revokeInvitation
      summary: Revoke a pending invitation (admin/supervisor)
      tags: [invitations]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Revoked }
        '400': { description: Not a pending invitation }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Caller lacks invite permission }
        '404': { description: Invitation not found }
  /v1/members:
    get:
      operationId: listMembers
      summary: List organization members (admin/supervisor)
      tags: [members]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Members (org-scoped)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Membership' }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Caller lacks read permission }
  /v1/work-items:
    get:
      operationId: listWorkItems
      summary: List task-kernel work items (org-scoped; ledger scope applies when present)
      description: |
        Visibility and actionability are separate. The response includes
        backend-computed `availableActions`; frontends must not infer task
        permissions from local role names.
      tags: [work-items]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: view
          in: query
          required: false
          schema:
            type: string
            enum: [my_tasks, role_queue, created_by_me, handled_by_me, supervision, audit_readonly]
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, claimed, waiting, returned, completed, canceled]
        - { name: sourceType, in: query, required: false, schema: { type: string } }
        - { name: sourceId, in: query, required: false, schema: { type: string, format: uuid } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Work items visible to the caller
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/WorkItem' }
        '400': { description: Invalid view/status/sourceId/limit/cursor filter }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Caller lacks read permission or supervision view access }
  /v1/work-items/{id}:
    get:
      operationId: getWorkItem
      summary: Work item detail with backend-computed actions
      tags: [work-items]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Work item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkItem' }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Caller lacks read permission }
        '404': { description: Work item not found in caller scope }
  /v1/work-items/{id}/actions/{actionKey}:
    post:
      operationId: actOnWorkItem
      summary: Execute a backend-authorized work item action
      description: |
        `complete` for finance voucher-review tasks posts the source voucher and
        completes the work item in one transaction. Stale `expectedVersion`
        values are rejected.
      tags: [work-items]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: actionKey, in: path, required: true, schema: { $ref: '#/components/schemas/WorkItemAction' } }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkItemActionRequest' }
      responses:
        '200':
          description: Action executed
          content:
            application/json:
              schema:
                type: object
                required: [workItem]
                properties:
                  workItem: { $ref: '#/components/schemas/WorkItem' }
                  source:
                    oneOf:
                      - { $ref: '#/components/schemas/Voucher' }
                      - { type: 'null' }
        '400': { description: Invalid action or source state }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Action not available to caller }
        '404': { description: Work item or source not found }
        '409': { description: Stale version or no longer actionable }
  /v1/accounts:
    get:
      operationId: listAccounts
      summary: List chart of accounts (ledger-scoped, code order = tree pre-order)
      tags: [accounts]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Account' }
        '400': { description: No active ledger book on the token }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Ledger book not in caller's org / lacks read permission }
    post:
      operationId: createAccount
      summary: Create an account (accountant/admin)
      tags: [accounts]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccount' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { description: Invalid body / duplicate code / parent not found }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Lacks create permission }
  /v1/accounts/seed-standard:
    post:
      operationId: seedStandardChart
      summary: Seed the standard chart v2 (idempotent; non-empty ledgers go through the safe diff engine)
      tags: [accounts]
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Seed result (skipped posted-leaf conflicts are reported, never silently applied)
          content:
            application/json:
              schema:
                type: object
                required: [seeded, convertedParents, conflicts]
                properties:
                  seeded: { type: integer }
                  convertedParents: { type: integer }
                  conflicts:
                    type: array
                    items:
                      type: object
                      required: [code, name, reason]
                      properties: { code: { type: string }, name: { type: string }, reason: { type: string } }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Lacks create permission }
  /v1/accounts/standard-diff:
    get:
      operationId: getStandardChartDiff
      summary: Preview standard chart v2 additions for this ledger (T-012 D6; no changes applied)
      tags: [accounts]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Diff between the v2 template and the ledger's chart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardChartDiff' }
  /v1/accounts/import-standard:
    post:
      operationId: importStandardChart
      summary: Explicit additive import of standard chart v2 (adds missing; flips activity-free leaf parents; reports posted-leaf conflicts untouched)
      tags: [accounts]
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Import result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StandardChartImportResult' }
        '403': { description: Lacks create permission }
  /v1/account-preferences:
    get:
      operationId: getAccountPreferences
      summary: Merged account display preferences — ledger default + the caller's personal (T-012 D5; display-only)
      tags: [accounts]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountPreferences' }
    patch:
      operationId: updateAccountPreferences
      summary: Update the caller's personal pinned/hidden account lists
      tags: [accounts]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pinned: { type: array, items: { type: string } }
                hidden: { type: array, items: { type: string } }
      responses:
        '200':
          description: Updated preferences (merged view)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountPreferences' }
  /v1/account-preferences/ledger-default:
    patch:
      operationId: updateLedgerAccountDefaults
      summary: Update the team's recommended account list (accounting/admin)
      tags: [accounts]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recommended]
              properties:
                recommended: { type: array, items: { type: string } }
      responses:
        '200':
          description: Updated preferences (merged view)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountPreferences' }
        '403': { description: Lacks account update permission }
  /v1/accounts/{code}:
    patch:
      operationId: updateAccount
      summary: Update an account's name / aux types (accountant/admin)
      tags: [accounts]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                auxTypes: { type: array, items: { type: string } }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { description: Invalid body }
        '404': { description: Account not found }
  /v1/accounts/{code}/deactivate:
    post:
      operationId: deactivateAccount
      summary: Deactivate an account (blocked if it has active children)
      tags: [accounts]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Deactivated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { description: Account has active children }
        '404': { description: Account not found }
  /v1/vouchers:
    get:
      operationId: listVouchers
      summary: List journal vouchers (ledger-scoped; optional status filter)
      tags: [vouchers]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [draft, pending, posted, reversed] } }
      responses:
        '200':
          description: Vouchers
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Voucher' } }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Ledger not in org / lacks read }
    post:
      operationId: createVoucher
      summary: Create a draft voucher (accountant/cashier)
      tags: [vouchers]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateVoucher' } } }
      responses:
        '201':
          description: Created (draft; may be unbalanced)
          content: { application/json: { schema: { $ref: '#/components/schemas/Voucher' } } }
        '400': { description: Invalid body / non-leaf or inactive account / malformed line }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Lacks create permission }
  /v1/vouchers/{id}:
    get:
      operationId: getVoucher
      summary: Voucher detail (with lines)
      tags: [vouchers]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Voucher, content: { application/json: { schema: { $ref: '#/components/schemas/Voucher' } } } }
        '404': { description: Not found }
    patch:
      operationId: updateVoucher
      summary: Replace a draft voucher's header + lines (only while draft)
      tags: [vouchers]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateVoucher' } } }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Voucher' } } } }
        '400': { description: Not a draft / invalid }
        '404': { description: Not found }
  /v1/vouchers/{id}/submit:
    post:
      operationId: submitVoucher
      summary: Submit a draft for review (draft → pending); enforces 借贷必平
      tags: [vouchers]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Submitted, content: { application/json: { schema: { $ref: '#/components/schemas/Voucher' } } } }
        '400': { description: Not a draft / unbalanced }
        '404': { description: Not found }
  /v1/vouchers/{id}/post:
    post:
      operationId: postVoucher
      summary: Post a pending voucher (pending → posted; SoD — maker ≠ poster)
      description: |
        职责分离: the maker cannot post their own voucher unless single-person mode
        is enabled on the ledger AND the caller confirms (body confirmSinglePerson).
      tags: [vouchers]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties: { confirmSinglePerson: { type: boolean } }
      responses:
        '200': { description: Posted, content: { application/json: { schema: { $ref: '#/components/schemas/Voucher' } } } }
        '400': { description: Not pending / unbalanced }
        '403': { description: SoD — maker cannot post own (without single-person override) / lacks post }
        '404': { description: Not found }
  /v1/vouchers/{id}/reverse:
    post:
      operationId: reverseVoucher
      summary: Reverse a posted voucher (红冲) — creates a posted reversal voucher
      tags: [vouchers]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: Original (now reversed) + the generated reversal voucher
          content:
            application/json:
              schema:
                type: object
                required: [original, reversal]
                properties:
                  original: { $ref: '#/components/schemas/Voucher' }
                  reversal: { $ref: '#/components/schemas/Voucher' }
        '400': { description: Not posted / already reversed }
        '403': { description: Lacks reverse permission }
        '404': { description: Not found }
  /v1/intakes:
    get:
      operationId: listIntakes
      summary: List capture intakes (ledger-scoped; optional status filter)
      tags: [intakes]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [received, extracting, extracted, drafted, confirmed, discarded, failed] } }
      responses:
        '200':
          description: Intakes
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Intake' } } } }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Ledger not in org / lacks read }
    post:
      operationId: captureIntake
      summary: Capture an economic event (photo/pdf/text) for extraction → voucher draft
      tags: [intakes]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CaptureIntake' } } }
      responses:
        '201':
          description: Created (status=received); extraction runs next
          content: { application/json: { schema: { $ref: '#/components/schemas/Intake' } } }
        '400': { description: Invalid body / unsupported kind / attachment too large }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Lacks create permission }
  /v1/intakes/{id}:
    get:
      operationId: getIntake
      summary: Intake detail (includes extraction; ERP-only, never sent to My-Chat)
      tags: [intakes]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Intake, content: { application/json: { schema: { $ref: '#/components/schemas/Intake' } } } }
        '404': { description: Not found }
  /v1/intakes/{id}/extract:
    post:
      operationId: extractIntake
      summary: Run extraction on a received intake (received → extracted)
      tags: [intakes]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Extracted, content: { application/json: { schema: { $ref: '#/components/schemas/Intake' } } } }
        '400': { description: No attachment / not extractable / invalid extraction }
        '404': { description: Not found }
  /v1/intakes/{id}/draft:
    post:
      operationId: draftIntake
      summary: Build a voucher draft from an extracted intake (extracted → drafted)
      tags: [intakes]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Drafted, content: { application/json: { schema: { $ref: '#/components/schemas/Intake' } } } }
        '400': { description: Not extracted / no valid extraction }
        '404': { description: Not found }
  /v1/intakes/{id}/discard:
    post:
      operationId: discardIntake
      summary: Discard an intake (→ discarded); any draft voucher remains a draft
      tags: [intakes]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200': { description: Discarded, content: { application/json: { schema: { $ref: '#/components/schemas/Intake' } } } }
        '400': { description: Cannot discard a confirmed intake }
        '404': { description: Not found }
  /v1/ledger/trial-balance:
    get:
      operationId: getTrialBalance
      summary: Trial balance (试算平衡表) — derived from posted vouchers
      tags: [ledger]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: period
          in: query
          required: false
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
          description: Accounting period (YYYY-MM). Prior movement is rolled into opening balance.
      responses:
        '200':
          description: Trial balance
          content: { application/json: { schema: { $ref: '#/components/schemas/TrialBalance' } } }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Ledger not in org / lacks read }
  /v1/ledger/accounts/{code}:
    get:
      operationId: getAccountLedger
      summary: Subsidiary ledger (明细分类账) for one account — derived, running balance
      tags: [ledger]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
        - name: period
          in: query
          required: false
          schema: { type: string, pattern: '^\d{4}-\d{2}$' }
          description: Accounting period (YYYY-MM). Prior movement is rolled into opening balance.
      responses:
        '200':
          description: Account ledger
          content: { application/json: { schema: { $ref: '#/components/schemas/AccountLedger' } } }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Ledger not in org / lacks read }
  /v1/periods:
    get:
      operationId: listPeriodCloses
      summary: List period-close records (会计期间结账状态)
      tags: [periods]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Periods
          content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/PeriodClose' } } } }
  /v1/periods/{period}/readiness:
    get:
      operationId: getPeriodCloseReadiness
      summary: Close-readiness for a period (未过账 / 前期未结账)
      tags: [periods]
      security: [{ bearerAuth: [] }]
      parameters: [{ name: period, in: path, required: true, schema: { type: string, example: '2026-06' } }]
      responses:
        '200': { description: Readiness, content: { application/json: { schema: { $ref: '#/components/schemas/PeriodCloseReadiness' } } } }
        '400': { description: Invalid period }
  /v1/periods/{period}/close:
    post:
      operationId: closePeriod
