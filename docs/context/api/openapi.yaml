openapi: 3.1.0
info:
  title: My-ERP API
  version: 0.1.0
  description: |
    Canonical API contract for My-ERP (finance v1).
    After edits run:
      node .ai/skills/features/context-awareness/scripts/ctl-context.mjs touch
      node .ai/scripts/ctl-api-index.mjs generate --touch
servers:
  - url: http://localhost:8000
    description: Local development
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness probe (includes a DB ping)
      tags: [system]
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /v1/organization:
    get:
      operationId: getCurrentOrganization
      summary: The caller's current organization (org-scoped)
      tags: [organization]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller has no membership in the organization
  /v1/ledger-books:
    get:
      operationId: listLedgerBooks
      summary: List ledger books in the caller's organization
      tags: [ledger-books]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Ledger books (org-scoped)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LedgerBook'
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller lacks read permission / no membership
    post:
      operationId: createLedgerBook
      summary: Create a ledger book (账套) — admin/supervisor only
      tags: [ledger-books]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLedgerBook'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerBook'
        '400':
          description: Invalid body
        '401':
          description: Missing or invalid bearer token
        '403':
          description: Caller lacks create permission
  /v1/invitations:
    get:
      operationId: listInvitations
      summary: List invitations (admin/supervisor)
      tags: [invitations]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Invitations (org-scoped)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Invitation' }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Caller lacks invite permission }
    post:
      operationId: createInvitation
      summary: Invite a user by email with a role (admin/supervisor)
      tags: [invitations]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvitation' }
      responses:
        '201':
          description: Created (carries the secret token)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '400': { description: Invalid body }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Caller lacks invite permission }
  /v1/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Accept an invitation (authenticated invitee — not yet a member)
      description: |
        Authn-only (PrincipalGuard); the caller is not yet a member. Validates the
        secret token + invited email + state machine, then creates the Membership.
      tags: [invitations]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AcceptInvitation' }
      responses:
        '200':
          description: Membership created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Membership' }
        '400': { description: Invalid/expired/mismatched invitation }
        '401': { description: Missing or invalid bearer token }
        '404': { description: Invitation not found }
        '409': { description: Already a member }
  /v1/invitations/{id}/revoke:
    post:
      operationId: revokeInvitation
      summary: Revoke a pending invitation (admin/supervisor)
      tags: [invitations]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Revoked }
        '400': { description: Not a pending invitation }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Caller lacks invite permission }
        '404': { description: Invitation not found }
  /v1/members:
    get:
      operationId: listMembers
      summary: List organization members (admin/supervisor)
      tags: [members]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Members (org-scoped)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Membership' }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Caller lacks read permission }
  /v1/accounts:
    get:
      operationId: listAccounts
      summary: List chart of accounts (ledger-scoped, code order = tree pre-order)
      tags: [accounts]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Account' }
        '400': { description: No active ledger book on the token }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Ledger book not in caller's org / lacks read permission }
    post:
      operationId: createAccount
      summary: Create an account (accountant/admin)
      tags: [accounts]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAccount' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { description: Invalid body / duplicate code / parent not found }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Lacks create permission }
  /v1/accounts/seed-standard:
    post:
      operationId: seedStandardChart
      summary: Seed the 《小企业准则》 standard chart (idempotent)
      tags: [accounts]
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Number of accounts newly seeded
          content:
            application/json:
              schema:
                type: object
                required: [seeded]
                properties: { seeded: { type: integer } }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Lacks create permission }
  /v1/accounts/{code}:
    patch:
      operationId: updateAccount
      summary: Update an account's name / aux types (accountant/admin)
      tags: [accounts]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                auxTypes: { type: array, items: { type: string } }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { description: Invalid body }
        '404': { description: Account not found }
  /v1/accounts/{code}/deactivate:
    post:
      operationId: deactivateAccount
      summary: Deactivate an account (blocked if it has active children)
      tags: [accounts]
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Deactivated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Account' }
        '400': { description: Account has active children }
        '404': { description: Account not found }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        HS256 dev token (P0b mock identity). Carries sub/orgId/ledgerBookId
        (+ optional email). Roles are resolved from Membership, not the token.
        Real Logto (OIDC/JWKS) replaces the verifier later.
  schemas:
    HealthStatus:
      type: object
      required: [status, service, time]
      properties:
        status: { type: string, example: ok }
        service: { type: string }
        time: { type: string, format: date-time }
    Organization:
      type: object
      required: [id, name, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        createdAt: { type: string, format: date-time }
    LedgerBook:
      type: object
      required: [id, orgId, name, baseCurrency, fiscalYear, periodStructure, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        name: { type: string }
        baseCurrency: { type: string, example: CNY }
        fiscalYear: { type: integer, example: 2026 }
        periodStructure: { type: string, example: '12+1' }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    CreateLedgerBook:
      type: object
      required: [name, baseCurrency, fiscalYear]
      properties:
        name: { type: string }
        baseCurrency: { type: string, example: CNY }
        fiscalYear: { type: integer, example: 2026 }
        periodStructure: { type: string, example: '12+1' }
    Role:
      type: string
      enum: [accountant, cashier, supervisor, admin, viewer]
    Membership:
      type: object
      required: [id, orgId, userId, role, createdAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        userId: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        email: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    Invitation:
      type: object
      required: [id, orgId, invitedEmail, role, status, invitedBy, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        orgId: { type: string, format: uuid }
        invitedEmail: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        token: { type: string, description: 'Secret; present only in the create response, never in listings' }
        status: { type: string, enum: [pending, accepted, revoked, expired] }
        invitedBy: { type: string }
        expiresAt: { type: string, format: date-time }
        acceptedBy: { type: string, nullable: true }
        acceptedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    CreateInvitation:
      type: object
      required: [email, role]
      properties:
        email: { type: string }
        role: { $ref: '#/components/schemas/Role' }
    AcceptInvitation:
      type: object
      required: [token]
      properties:
        token: { type: string }
    Account:
      type: object
      required: [id, ledgerBookId, code, name, category, direction, level, isLeaf, auxTypes, active, createdAt]
      properties:
        id: { type: string, format: uuid }
        ledgerBookId: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        category: { type: string, enum: [asset, liability, equity, cost, profitLoss] }
        direction: { type: string, enum: [debit, credit] }
        parentCode: { type: string, nullable: true }
        level: { type: integer }
        isLeaf: { type: boolean }
        auxTypes: { type: array, items: { type: string, enum: [customer, supplier, department, project] } }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
    CreateAccount:
      type: object
      required: [code, name, category, direction]
      properties:
        code: { type: string, description: 'Numeric; longer codes nest under shorter ones' }
        name: { type: string }
        category: { type: string, enum: [asset, liability, equity, cost, profitLoss] }
        direction: { type: string, enum: [debit, credit] }
        parentCode: { type: string }
        auxTypes: { type: array, items: { type: string, enum: [customer, supplier, department, project] } }
