        - { name: type, in: query, required: false, schema: { type: string, enum: [sales, purchase, service, other] } }
        - { name: partnerId, in: query, required: false, schema: { type: string, format: uuid }, description: 'Filter by linked BusinessPartner (T-012)' }
      responses:
        '200': { description: Contracts, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Contract' } } } } }
    post:
      operationId: createContract
      summary: Create a 合同 (code auto-assigned HT-{fiscalYear}-{NNN})
      tags: [contracts]
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateContract' } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Contract' } } } }
        '400': { description: Invalid input }
  /v1/contracts/{id}:
    get:
      operationId: getContract
      summary: Get a contract
      tags: [contracts]
